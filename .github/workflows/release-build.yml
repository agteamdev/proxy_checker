# Builds standalone binaries with PyInstaller for Windows, Linux and macOS
# (including a Linux AppImage - download, chmod +x, double-click/run, no
# Python or install step needed), then attaches them all to the GitHub
# Release of the pushed tag.
#
# Trigger: push a tag that starts with "v", e.g.:
#   git tag -a v2.4.0 -m "..."
#   git push origin v2.4.0
#
# Result: a Release for that tag (created if it doesn't exist yet) with:
#   - proxy-checker-windows.exe
#   - proxy-checker-linux           (raw binary, needs chmod +x)
#   - ProxyChecker-x86_64.AppImage  (Linux, chmod +x and run, no install)
#   - ProxyChecker-macos.zip        (macOS .app bundle, zipped)

name: Build and Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Windows executable
        run: >
          pyinstaller --onefile --windowed --name proxy-checker-windows
          --icon assets/icon.ico
          --add-data "assets;assets"
          main.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: proxy-checker-windows
          path: dist/proxy-checker-windows.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Tk (required by tkinter at build time)
        run: sudo apt-get update && sudo apt-get install -y python3-tk

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Linux binary
        run: >
          pyinstaller --onefile --name proxy-checker-linux
          --icon assets/icon.png
          --add-data "assets:assets"
          main.py

      - name: Upload raw binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: proxy-checker-linux
          path: dist/proxy-checker-linux

      - name: Assemble AppImage
        run: |
          mkdir -p AppDir/usr/bin
          cp dist/proxy-checker-linux AppDir/usr/bin/
          cp assets/icon_256.png AppDir/proxy-checker.png

          cat > AppDir/proxy-checker.desktop << 'EOF'
          [Desktop Entry]
          Type=Application
          Name=Proxy Checker
          Comment=HTTP/SOCKS4/SOCKS5 proxy checker with anonymity detection
          Exec=proxy-checker-linux
          Icon=proxy-checker
          Categories=Network;Utility;
          Terminal=false
          EOF

          cat > AppDir/AppRun << 'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "${0}")")"
          exec "${HERE}/usr/bin/proxy-checker-linux" "$@"
          EOF
          chmod +x AppDir/AppRun

          wget -q -O appimagetool.AppImage \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool.AppImage
          # GitHub-hosted runners don't have FUSE, so extract & run instead
          # of launching the AppImage directly.
          ./appimagetool.AppImage --appimage-extract
          ./squashfs-root/AppRun AppDir ProxyChecker-x86_64.AppImage

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: proxy-checker-appimage
          path: ProxyChecker-x86_64.AppImage

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build .icns icon from the master PNG
        run: |
          mkdir icon.iconset
          sips -z 16 16     assets/icon.png --out icon.iconset/icon_16x16.png
          sips -z 32 32     assets/icon.png --out icon.iconset/icon_16x16@2x.png
          sips -z 32 32     assets/icon.png --out icon.iconset/icon_32x32.png
          sips -z 64 64     assets/icon.png --out icon.iconset/icon_32x32@2x.png
          sips -z 128 128   assets/icon.png --out icon.iconset/icon_128x128.png
          sips -z 256 256   assets/icon.png --out icon.iconset/icon_128x128@2x.png
          sips -z 256 256   assets/icon.png --out icon.iconset/icon_256x256.png
          sips -z 512 512   assets/icon.png --out icon.iconset/icon_256x256@2x.png
          sips -z 512 512   assets/icon.png --out icon.iconset/icon_512x512.png
          cp assets/icon.png icon.iconset/icon_512x512@2x.png
          iconutil -c icns icon.iconset -o assets/icon.icns

      - name: Build macOS app bundle
        run: >
          pyinstaller --onefile --windowed --name "Proxy Checker"
          --icon assets/icon.icns
          --add-data "assets:assets"
          main.py

      - name: Zip the .app bundle
        run: |
          cd dist
          zip -r ../ProxyChecker-macos.zip "Proxy Checker.app"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: proxy-checker-macos
          path: ProxyChecker-macos.zip

  release:
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    # The default GITHUB_TOKEN is read-only unless explicitly granted write
    # access here. Without this block, softprops/action-gh-release fails with
    # "403 Resource not accessible by integration".
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish GitHub Release with binaries attached
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/proxy-checker-windows/proxy-checker-windows.exe
            artifacts/proxy-checker-linux/proxy-checker-linux
            artifacts/proxy-checker-appimage/ProxyChecker-x86_64.AppImage
            artifacts/proxy-checker-macos/ProxyChecker-macos.zip
